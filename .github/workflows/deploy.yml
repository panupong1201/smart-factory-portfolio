name: Deploy to Windows VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd "C:\Users\Administrator\Desktop\deploy-node\package" && pm2 delete smart-factory-portfolio || echo "Not running" && ping -n 6 127.0.0.1 > nul && rmdir /S /Q .next && git fetch --all && git reset --hard origin/main && git clean -fd -e storage/ -e .env.local && npm install && npx prisma generate && npx prisma migrate deploy && npm run build && xcopy /E /I /Y ".next\static" ".next\standalone\.next\static" && xcopy /E /I /Y "public" ".next\standalone\public" && pm2 start ".next\standalone\server.js" --name "smart-factory-portfolio" && pm2 save