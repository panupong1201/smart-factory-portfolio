name: Deploy to Windows VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd /d "C:\Users\Administrator\Desktop\deploy-node\package" && (pm2 stop smart-factory-portfolio || echo PM2: not running) && git fetch --all && git reset --hard origin/main && git clean -fd -e storage/ -e .env.local && npm install && npx prisma generate && (npx prisma migrate deploy || echo WARN: prisma migrate skipped) && npm run build && if not exist ".next\standalone\server.js" (echo ERROR: standalone server not found & exit /b 1) && (pm2 startOrReload ecosystem.config.cjs --only smart-factory-portfolio --update-env || (pm2 delete smart-factory-portfolio & pm2 start ecosystem.config.cjs --only smart-factory-portfolio --update-env)) && pm2 save